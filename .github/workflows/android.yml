      - name: App icon
        run: |
          if [ -f icon.png ]; then
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os, glob
          im = Image.open('icon.png').convert('RGBA')
          w, h = im.size
          m = min(w, h)
          l = (w - m) // 2
          t = (h - m) // 2
          im = im.crop((l, t, l + m, t + m))
          res = 'android/app/src/main/res'
          for f in glob.glob(res + '/mipmap-*/ic_launcher*.webp'):
              os.remove(f)
          for d, k in {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}.items():
              p = res + '/mipmap-' + d
              os.makedirs(p, exist_ok=True)
              s = int(48 * k)
              a = im.resize((s, s), Image.LANCZOS)
              a.save(p + '/ic_launcher.png')
              mk = Image.new('L', (s, s), 0)
              ImageDraw.Draw(mk).ellipse((0, 0, s - 1, s - 1), fill=255)
              r = Image.new('RGBA', (s, s), (0, 0, 0, 0))
              r.paste(a, (0, 0), mk)
              r.save(p + '/ic_launcher_round.png')
              b = int(108 * k)
              im.resize((b, b), Image.LANCZOS).save(p + '/rayni_bg.png')
              Image.new('RGBA', (b, b), (0, 0, 0, 0)).save(p + '/rayni_fg.png')
          x = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n<background android:drawable="@mipmap/rayni_bg"/>\n<foreground android:drawable="@mipmap/rayni_fg"/>\n</adaptive-icon>\n'
          os.makedirs(res + '/mipmap-anydpi-v26', exist_ok=True)
          for n in ('ic_launcher', 'ic_launcher_round'):
              open(res + '/mipmap-anydpi-v26/' + n + '.xml', 'w').write(x)
          PY
