name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor project
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/filesystem@6 @capacitor/share@6 jszip@3.10.1
          cp node_modules/jszip/dist/jszip.min.js www/jszip.min.js
          npx cap init "Rainy: Audio player" com.rainy.player --web-dir www
          python3 - <<'PY'
          import json
          c=json.load(open('capacitor.config.json'))
          c['android']={'backgroundColor':'#0b0714'}
          c['plugins']={'CapacitorHttp':{'enabled':True}}
          json.dump(c,open('capacitor.config.json','w'),indent=2)
          PY
          npx cap add android
      - name: Android patch (service, permissions)
        run: |
          D=android/app/src/main/java/com/rainy/player
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/layout
          cat > android/app/src/main/res/layout/notif_small.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical">
          <ImageView android:id="@+id/n_art" android:layout_width="48dp" android:layout_height="48dp" android:scaleType="centerCrop" android:layout_marginEnd="10dp"/>
          <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">
          <TextView android:id="@+id/n_title" android:layout_width="match_parent" android:layout_height="wrap_content" android:singleLine="true" android:ellipsize="end" android:textAppearance="@android:style/TextAppearance.Material.Notification.Title"/>
          <TextView android:id="@+id/n_artist" android:layout_width="match_parent" android:layout_height="wrap_content" android:singleLine="true" android:ellipsize="end" android:textAppearance="@android:style/TextAppearance.Material.Notification"/>

          </LinearLayout>
          <ImageButton android:id="@+id/n_fav" android:layout_width="44dp" android:layout_height="44dp" android:background="@android:color/transparent" android:scaleType="centerInside" android:padding="10dp" android:contentDescription="favorite"/>
          </LinearLayout>
          EOF
          cat > android/app/src/main/res/layout/notif_big.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical">
          <ImageView android:id="@+id/n_art" android:layout_width="72dp" android:layout_height="72dp" android:scaleType="centerCrop" android:layout_marginEnd="10dp"/>
          <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">
          <TextView android:id="@+id/n_title" android:layout_width="match_parent" android:layout_height="wrap_content" android:singleLine="true" android:ellipsize="end" android:textAppearance="@android:style/TextAppearance.Material.Notification.Title"/>
          <TextView android:id="@+id/n_artist" android:layout_width="match_parent" android:layout_height="wrap_content" android:singleLine="true" android:ellipsize="end" android:textAppearance="@android:style/TextAppearance.Material.Notification"/>
          <ProgressBar android:id="@+id/n_prog" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="6dp" android:max="100"/>
          <TextView android:id="@+id/n_time" android:layout_width="match_parent" android:layout_height="wrap_content" android:singleLine="true" android:ellipsize="end" android:textAppearance="@android:style/TextAppearance.Material.Notification"/>
          </LinearLayout>
          <ImageButton android:id="@+id/n_fav" android:layout_width="44dp" android:layout_height="44dp" android:background="@android:color/transparent" android:scaleType="centerInside" android:padding="10dp" android:contentDescription="favorite"/>
          </LinearLayout>
          EOF
          cat > android/app/src/main/res/drawable/ic_heart_off.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:strokeColor="#FFFFFF" android:strokeWidth="2" android:strokeLineJoin="round" android:fillColor="#00000000" android:pathData="M12,21.35l-1.45,-1.32C5.4,15.36 2,12.28 2,8.5 2,5.42 4.42,3 7.5,3c1.74,0 3.41,0.81 4.5,2.09C13.09,3.81 14.76,3 16.5,3 19.58,3 22,5.42 22,8.5c0,3.78 -3.4,6.86 -8.55,11.54L12,21.35z"/></vector>
          EOF
          cat > android/app/src/main/res/drawable/ic_heart_on.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF3B30" android:pathData="M12,21.35l-1.45,-1.32C5.4,15.36 2,12.28 2,8.5 2,5.42 4.42,3 7.5,3c1.74,0 3.41,0.81 4.5,2.09C13.09,3.81 14.76,3 16.5,3 19.58,3 22,5.42 22,8.5c0,3.78 -3.4,6.86 -8.55,11.54L12,21.35z"/></vector>
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.rainy.player;
          import android.os.Bundle;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.IntentSenderRequest;
          import androidx.activity.result.contract.ActivityResultContracts;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            public ActivityResultLauncher<IntentSenderRequest> delL = registerForActivityResult(
              new ActivityResultContracts.StartIntentSenderForResult(), r -> BgPlugin.deleted(r.getResultCode() == RESULT_OK));
            @Override public void onCreate(Bundle b) {
              registerPlugin(BgPlugin.class);
              super.onCreate(b);
              getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
            }
            @Override public void onPause() {
              super.onPause();
              getBridge().getWebView().onResume();
              getBridge().getWebView().resumeTimers();
            }
            @Override public void onStop() {
              super.onStop();
              getBridge().getWebView().onResume();
              getBridge().getWebView().resumeTimers();
            }
          }
          EOF
          cat > $D/BgPlugin.java <<'EOF'
          package com.rainy.player;
          import android.Manifest;
          import android.app.PendingIntent;
          import android.graphics.Bitmap;
          import android.media.MediaMetadataRetriever;
          import androidx.activity.result.IntentSenderRequest;
          import java.io.ByteArrayOutputStream;
          import java.util.ArrayList;
          import java.util.List;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.database.ContentObserver;
          import android.database.Cursor;
          import android.graphics.BitmapFactory;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.WindowManager;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          @CapacitorPlugin(name = "Bg", permissions = {
            @Permission(alias = "audio", strings = {Manifest.permission.READ_EXTERNAL_STORAGE}),
            @Permission(alias = "audio13", strings = {Manifest.permission.READ_MEDIA_AUDIO})
          })
          public class BgPlugin extends Plugin {
            static BgPlugin I;
            static void deleted(boolean ok) {
              if (I == null) return;
              JSObject o = new JSObject();
              o.put("ok", ok);
              I.notifyListeners("deleted", o);
            }
            private boolean obs = false;
            static void emit(String a, long p) {
              if (I == null) return;
              JSObject o = new JSObject();
              o.put("a", a);
              o.put("p", p);
              I.notifyListeners("act", o);
            }
            @Override public void load() {
              I = this;
              getContext().registerReceiver(new BroadcastReceiver() {
                @Override public void onReceive(Context c, Intent i) { notifyListeners("noisy", new JSObject()); }
              }, new IntentFilter(AudioManager.ACTION_AUDIO_BECOMING_NOISY));
            }
            private String alias() { return Build.VERSION.SDK_INT >= 33 ? "audio13" : "audio"; }
            @PluginMethod public void scan(PluginCall call) {
              if (getPermissionState(alias()) != PermissionState.GRANTED) { requestPermissionForAlias(alias(), call, "permDone"); return; }
              doScan(call);
            }
            @PermissionCallback private void permDone(PluginCall call) {
              if (getPermissionState(alias()) == PermissionState.GRANTED) doScan(call); else call.reject("denied");
            }
            private void doScan(PluginCall call) {
              try {
                JSArray arr = new JSArray();
                Uri u = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;
                String[] pr = {MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE, MediaStore.Audio.Media.ARTIST, MediaStore.Audio.Media.DURATION, MediaStore.Audio.Media.DISPLAY_NAME, MediaStore.Audio.Media.DATE_ADDED, MediaStore.Audio.Media.ALBUM, MediaStore.Audio.Media.ALBUM_ID, Build.VERSION.SDK_INT >= 29 ? MediaStore.Audio.Media.RELATIVE_PATH : MediaStore.Audio.Media.DATA};
                String sel = MediaStore.Audio.Media.IS_RINGTONE + "=0 AND " + MediaStore.Audio.Media.IS_NOTIFICATION + "=0 AND " + MediaStore.Audio.Media.IS_ALARM + "=0";
                if (Build.VERSION.SDK_INT >= 29) {
                  String rp = MediaStore.Audio.Media.RELATIVE_PATH;
                  sel += " AND (" + rp + " IS NULL OR (" + rp + " NOT LIKE '%Recordings%' AND " + rp + " NOT LIKE '%Voice%' AND " + rp + " NOT LIKE 'Android/%'))";
                }
                Cursor cu = getContext().getContentResolver().query(u, pr, sel, null, MediaStore.Audio.Media.DATE_ADDED + " DESC");
                if (cu != null) {
                  while (cu.moveToNext()) {
                    JSObject o = new JSObject();
                    long id = cu.getLong(0);
                    String ar = cu.getString(2);
                    o.put("id", id);
                    o.put("uri", ContentUris.withAppendedId(u, id).toString());
                    o.put("title", cu.getString(1));
                    o.put("artist", "<unknown>".equals(ar) ? "" : ar);
                    o.put("dur", cu.getLong(3));
                    o.put("file", cu.getString(4));
                    o.put("added", cu.getLong(5));
                    String al = cu.getString(6);
                    o.put("album", "<unknown>".equals(al) || al == null ? "" : al);
                    o.put("alb", cu.getLong(7));
                    String rp = cu.getString(8);
                    if (Build.VERSION.SDK_INT < 29 && rp != null) { int k = rp.lastIndexOf('/'); rp = k > 0 ? rp.substring(0, k) : rp; }
                    o.put("rel", rp == null ? "" : rp);
                    arr.put(o);
                  }
                  cu.close();
                }
                if (!obs) {
                  obs = true;
                  getContext().getContentResolver().registerContentObserver(u, true, new ContentObserver(new Handler(Looper.getMainLooper())) {
                    @Override public void onChange(boolean s) { notifyListeners("lib", new JSObject()); }
                  });
                }
                JSObject r = new JSObject();
                r.put("items", arr);
                r.put("sdk", Build.VERSION.SDK_INT);
                call.resolve(r);
              } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
            private Bitmap sq(Bitmap bm, int size) {
              if (bm == null) return null;
              int m = Math.min(bm.getWidth(), bm.getHeight());
              Bitmap c = Bitmap.createBitmap(bm, (bm.getWidth() - m) / 2, (bm.getHeight() - m) / 2, m, m);
              int t = Math.min(size, m);
              return Bitmap.createScaledBitmap(c, t, t, true);
            }
            private Bitmap decodeSized(byte[] b, int size) {
              android.graphics.BitmapFactory.Options o = new android.graphics.BitmapFactory.Options();
              o.inJustDecodeBounds = true;
              BitmapFactory.decodeByteArray(b, 0, b.length, o);
              int s = 1;
              if (o.outWidth > 0) while (o.outWidth / (s * 2) >= size && o.outHeight / (s * 2) >= size) s *= 2;
              o = new android.graphics.BitmapFactory.Options();
              o.inSampleSize = s;
              return BitmapFactory.decodeByteArray(b, 0, b.length, o);
            }
            @PluginMethod public void art(PluginCall call) {
              JSObject res = new JSObject();
              res.put("data", "");
              int size = call.getInt("size", 160);
              Uri uri = Uri.parse(call.getString("uri", ""));
              Bitmap bm = null;
              MediaMetadataRetriever r = new MediaMetadataRetriever();
              try { r.setDataSource(getContext(), uri); byte[] b = r.getEmbeddedPicture(); if (b != null) bm = decodeSized(b, size); } catch (Exception e) {}
              try { r.release(); } catch (Exception e) {}
              if (bm == null && Build.VERSION.SDK_INT >= 29) {
                try { bm = getContext().getContentResolver().loadThumbnail(uri, new android.util.Size(size, size), null); } catch (Exception e) {}
              }
              long alb = (long) (double) call.getDouble("alb", 0.0);
              if (bm == null && alb > 0) {
                try {
                  Uri au = ContentUris.withAppendedId(Uri.parse("content://media/external/audio/albumart"), alb);
                  java.io.InputStream in = getContext().getContentResolver().openInputStream(au);
                  if (in != null) { bm = BitmapFactory.decodeStream(in); in.close(); }
                } catch (Exception e) {}
              }
              try {
                Bitmap out = sq(bm, size);
                if (out != null) {
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  out.compress(Bitmap.CompressFormat.JPEG, 80, bo);
                  res.put("data", Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP));
                }
              } catch (Exception e) {}
              call.resolve(res);
            }
            @PluginMethod public void remove(PluginCall call) {
              try {
                if (Build.VERSION.SDK_INT < 30) { call.reject("sdk"); return; }
                JSArray a = call.getArray("uris");
                List<Uri> us = new ArrayList<>();
                for (int i = 0; i < a.length(); i++) us.add(Uri.parse(a.getString(i)));
                PendingIntent pi = MediaStore.createDeleteRequest(getContext().getContentResolver(), us);
                ((MainActivity) getActivity()).delL.launch(new IntentSenderRequest.Builder(pi.getIntentSender()).build());
                call.resolve();
              } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
            @PluginMethod public void notif(PluginCall call) {
              if (Build.VERSION.SDK_INT >= 33 && getContext().checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                getActivity().requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 77);
              call.resolve();
            }
            @PluginMethod public void start(PluginCall call) {
              try { ContextCompat.startForegroundService(getContext(), new Intent(getContext(), PlayerService.class)); } catch (Exception e) {}
              call.resolve();
            }
            @PluginMethod public void stop(PluginCall call) {
              getContext().stopService(new Intent(getContext(), PlayerService.class));
              call.resolve();
            }
            @PluginMethod public void update(PluginCall c) {
              PlayerService.T = c.getString("title", "Rainy: Audio player");
              PlayerService.A = c.getString("artist", "");
              PlayerService.P = Boolean.TRUE.equals(c.getBoolean("playing", false));
              PlayerService.F = Boolean.TRUE.equals(c.getBoolean("fav", false));
              PlayerService.L = !Boolean.FALSE.equals(c.getBoolean("lock", true));
              PlayerService.EN = "en".equals(c.getString("lang", "ru"));
              PlayerService.POS = (long) (double) c.getDouble("pos", 0.0);
              PlayerService.DUR = (long) (double) c.getDouble("dur", 0.0);
              PlayerService.SPD = (float) (double) c.getDouble("spd", 1.0);
              if (c.hasOption("cover")) {
                PlayerService.ART = null;
                PlayerService.ARTS = null;
                String s = c.getString("cover", "");
                if (s != null && !s.isEmpty()) {
                  try { byte[] b = Base64.decode(s, Base64.DEFAULT); PlayerService.ART = BitmapFactory.decodeByteArray(b, 0, b.length); PlayerService.ARTS = android.graphics.Bitmap.createScaledBitmap(PlayerService.ART, 160, 160, true); } catch (Exception e) {}
                }
              }
              PlayerService.push();
              c.resolve();
            }
            @PluginMethod public void awake(PluginCall call) {
              final boolean on = Boolean.TRUE.equals(call.getBoolean("on", false));
              getActivity().runOnUiThread(() -> {
                if (on) getActivity().getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                else getActivity().getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              });
              call.resolve();
            }
          }
          EOF
          cat > $D/PlayerService.java <<'EOF'
          package com.rainy.player;
          import android.app.*;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.content.res.Configuration;
          import android.graphics.Bitmap;
          import android.graphics.drawable.Icon;
          import android.media.MediaMetadata;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.*;
          import android.view.View;
          import android.widget.RemoteViews;
          public class PlayerService extends Service {
            static PlayerService S;
            static String T = "Rainy: Audio player", A = "";
            static boolean P = false, F = false, L = true, EN = false;
            static long POS = 0, DUR = 0;
            static float SPD = 1f;
            static Bitmap ART = null, ARTS = null;
            private PowerManager.WakeLock wl;
            private MediaSession ms;
            private long stamp = 0;
            private final Handler hd = new Handler(Looper.getMainLooper());
            private final Runnable tk = new Runnable() {
              @Override public void run() { if (P) { upd(); hd.postDelayed(this, 1000); } }
            };
            static void push() { if (S != null) S.apply(); }
            private static String fmt(long ms) {
              long s = Math.max(0, ms) / 1000;
              return (s / 60) + ":" + (s % 60 < 10 ? "0" : "") + (s % 60);
            }
            @Override public IBinder onBind(Intent i) { return null; }
            @Override public void onCreate() {
              super.onCreate();
              S = this;
              ms = new MediaSession(this, "Rainy");
              ms.setCallback(new MediaSession.Callback() {
                @Override public void onPlay() { BgPlugin.emit("play", 0); }
                @Override public void onPause() { BgPlugin.emit("pause", 0); }
                @Override public void onSkipToNext() { BgPlugin.emit("next", 0); }
                @Override public void onSkipToPrevious() { BgPlugin.emit("prev", 0); }
                @Override public void onSeekTo(long p) { BgPlugin.emit("seek", p); }
                @Override public void onCustomAction(String a, Bundle e) { BgPlugin.emit(a, 0); }
              });
              ms.setActive(true);
              if (Build.VERSION.SDK_INT >= 26)
                getSystemService(NotificationManager.class).createNotificationChannel(new NotificationChannel("rp", java.util.Locale.getDefault().getLanguage().equals("ru") ? "Воспроизведение" : "Playback", NotificationManager.IMPORTANCE_LOW));
            }
            private PendingIntent svc(String a) {
              return PendingIntent.getService(this, a.hashCode(), new Intent(this, PlayerService.class).setAction(a), PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
            }
            private Notification.Action act(String a, int icon, String label) {
              return new Notification.Action.Builder(Icon.createWithResource(this, icon), label, svc(a)).build();
            }
            private Notification build(long pos) {
              boolean night = (getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES;
              int fg = night ? 0xFFFFFFFF : 0xFF202124;
              if (DUR > 0) pos = Math.max(0, Math.min(DUR, pos));
              String sub = DUR > 0 ? fmt(pos) + " / " + fmt(DUR) : "";
              String artist = A.isEmpty() ? "Rainy: Audio player" : A;
              RemoteViews sm = new RemoteViews(getPackageName(), R.layout.notif_small);
              RemoteViews bg = new RemoteViews(getPackageName(), R.layout.notif_big);
              for (RemoteViews rv : new RemoteViews[]{sm, bg}) {
                rv.setTextViewText(R.id.n_title, T);
                rv.setTextViewText(R.id.n_artist, artist);
                if (ARTS != null) { rv.setImageViewBitmap(R.id.n_art, ARTS); rv.setViewVisibility(R.id.n_art, View.VISIBLE); }
                else rv.setViewVisibility(R.id.n_art, View.GONE);
                rv.setImageViewResource(R.id.n_fav, F ? R.drawable.ic_heart_on : R.drawable.ic_heart_off);
                if (!F) rv.setInt(R.id.n_fav, "setColorFilter", fg);
                rv.setOnClickPendingIntent(R.id.n_fav, svc("fav"));
              }
              bg.setTextViewText(R.id.n_time, sub);
              bg.setProgressBar(R.id.n_prog, DUR > 0 ? (int) DUR : 1, (int) pos, false);
              Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, "rp") : new Notification.Builder(this);
              Intent o = new Intent(this, MainActivity.class);
              o.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_NEW_TASK);
              b.setSmallIcon(android.R.drawable.ic_media_play).setContentTitle(T).setContentText(artist)
               .setOngoing(true).setOnlyAlertOnce(true).setVisibility(L ? Notification.VISIBILITY_PUBLIC : Notification.VISIBILITY_SECRET)
               .setContentIntent(PendingIntent.getActivity(this, 0, o, PendingIntent.FLAG_IMMUTABLE))
               .addAction(act("prev", android.R.drawable.ic_media_previous, EN ? "Previous" : "Назад"))
               .addAction(act("toggle", P ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play, P ? (EN ? "Pause" : "Пауза") : (EN ? "Play" : "Играть")))
               .addAction(act("next", android.R.drawable.ic_media_next, EN ? "Next" : "Дальше"))
               .setCustomContentView(sm).setCustomBigContentView(bg)
               .setStyle(new Notification.DecoratedMediaCustomViewStyle().setMediaSession(ms.getSessionToken()).setShowActionsInCompactView(0, 1, 2));
              if (DUR > 0) b.setSubText(sub);
              if (ARTS != null) b.setLargeIcon(ARTS);
              return b.build();
            }
            private void upd() {
              long pos = POS + (P ? (long) ((SystemClock.elapsedRealtime() - stamp) * SPD) : 0);
              getSystemService(NotificationManager.class).notify(1, build(pos));
            }
            void apply() {
              try {
                MediaMetadata.Builder m = new MediaMetadata.Builder()
                  .putString(MediaMetadata.METADATA_KEY_TITLE, T).putString(MediaMetadata.METADATA_KEY_ARTIST, A).putLong(MediaMetadata.METADATA_KEY_DURATION, DUR);
                if (ART != null) m.putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, ART);
                ms.setMetadata(m.build());
                ms.setPlaybackState(new PlaybackState.Builder()
                  .setActions(PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE | PlaybackState.ACTION_PLAY_PAUSE | PlaybackState.ACTION_SKIP_TO_NEXT | PlaybackState.ACTION_SKIP_TO_PREVIOUS | PlaybackState.ACTION_SEEK_TO)
                  .addCustomAction(new PlaybackState.CustomAction.Builder("fav", F ? (EN ? "Remove from favorites" : "Убрать из избранного") : (EN ? "Add to favorites" : "В избранное"), F ? R.drawable.ic_heart_on : R.drawable.ic_heart_off).build())
                  .setState(P ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED, POS, P ? SPD : 0f, SystemClock.elapsedRealtime()).build());
                stamp = SystemClock.elapsedRealtime();
                Notification n = build(POS);
                if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK); else startForeground(1, n);
                if (wl == null) wl = ((PowerManager) getSystemService(POWER_SERVICE)).newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "rainy:play");
                if (P && !wl.isHeld()) wl.acquire();
                if (!P && wl.isHeld()) wl.release();
                hd.removeCallbacks(tk);
                if (P) hd.postDelayed(tk, 1000);
              } catch (Exception e) {}
            }
            @Override public int onStartCommand(Intent i, int f, int id) {
              String a = i == null ? null : i.getAction();
